<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habitat Sorter</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🏡 Habitat Sorter</h1><p>Send each animal to its natural home.</p><div class="statline"><div class="stat">Homes found <b id="score">0</b>/8</div></div><div class="message" id="msg">Start sorting!</div><section class="board"><div id="animal" style="font-size:4rem">🐒</div><h2 id="prompt">Where does this animal live?</h2><div id="choices" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div></section><button class="button" id="start">▶ Start Sorting</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const data=[['🐒','Monkey','Rainforest canopy',['Rainforest canopy','Open ocean','Polar ice','Desert']],['🐊','Crocodile','River and wetlands',['River and wetlands','Mountain peak','Dry cave','Arctic shore']],['🐘','Elephant','Savanna and forest',['Savanna and forest','Deep ocean','Snowfield','Coral reef']],['🐼','Panda','Bamboo forest',['Bamboo forest','Grassland burrow','River delta','Open sea']],['🦉','Owl','Woodland trees',['Woodland trees','Open ocean','Desert dune','Ice cave']],['🦛','Hippo','Rivers and lakes',['Rivers and lakes','Tree canopy','Rocky mountain','Dry desert']],['🐧','Penguin','Cold southern coast',['Cold southern coast','Jungle canopy','Grassland','Freshwater swamp']],['🦒','Giraffe','African savanna',['African savanna','Coral reef','Polar coast','Underground burrow']]];let order=[],i=0,score=0;function show(){if(i>=8){document.getElementById('animal').textContent='🌎';document.getElementById('prompt').textContent='All animals are home!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='You matched '+score+' habitats correctly.';return}let a=data[order[i]];document.getElementById('animal').textContent=a[0];document.getElementById('prompt').textContent='Where does the '+a[1]+' live?';let box=document.getElementById('choices');box.innerHTML='';[...a[3]].sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{if(x===a[2])score++;i++;document.getElementById('score').textContent=score;document.getElementById('msg').textContent=x===a[2]?'That’s the right habitat!':'Good try, keep exploring!';setTimeout(show,600)};box.appendChild(b)})}document.getElementById('start').onclick=()=>{order=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5);i=0;score=0;document.getElementById('score').textContent=0;show()};
</script></main></body></html>
