<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vine Swing Challenge | Jungle Animal Stories</title><link rel="stylesheet" href="jungle-game-style.css"></head>
<body><main class="page"><div class="topline"><span>🪢 Vine Trail</span><span class="stat">🌳 Leap <b id="round">0</b>/5</span><span class="stat">⭐ <b id="score">0</b></span></div><h1>Vine Swing Challenge</h1><p>Press Swing when the moving leaf is inside the bright green landing zone.</p><div class="message" id="message">Press Start to begin your vine trail.</div><div class="board"><canvas id="meter" width="680" height="160" aria-label="Moving leaf timing meter"></canvas><p class="small">The landing zone shifts with each leap, so watch carefully!</p></div><div class="toolbar"><button class="button" id="start">▶ Start Trail</button><button class="button" id="swing" disabled>🌿 Swing!</button></div><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main>
<script>
const cv=document.getElementById('meter'),c=cv.getContext('2d'),msg=document.getElementById('message'),swing=document.getElementById('swing');let x=15,dir=1,zone=260,round=0,score=0,live=false,raf=0;function paint(){c.clearRect(0,0,680,160);c.fillStyle='#c1daa0';c.fillRect(18,66,644,34);c.fillStyle='#47a261';c.fillRect(zone,56,92,54);c.fillStyle='#5e8a44';c.fillRect(20,81,640,5);c.font='28px serif';c.fillText('🍃',x-14,82);if(live){x+=dir*(3+round*.7);if(x>650||x<30)dir*=-1;raf=requestAnimationFrame(paint)}}function start(){cancelAnimationFrame(raf);round=0;score=0;x=15;dir=1;zone=130+Math.random()*420;live=true;document.getElementById('round').textContent=0;document.getElementById('score').textContent=0;msg.textContent='The leaf is moving! Swing into the green zone.';swing.disabled=false;paint()}function leap(){if(!live)return;const center=zone+46,dist=Math.abs(x-center),limit=Math.max(20,47-round*3);if(dist<limit){score+=10;msg.textContent='Perfect landing! +10 points 🌟'}else msg.textContent='Missed the landing zone. Try the next vine!';round++;document.getElementById('round').textContent=Math.min(round,5);document.getElementById('score').textContent=score;if(round>=5){live=false;cancelAnimationFrame(raf);msg.textContent='🏆 Trail complete! You scored '+score+' points.';swing.disabled=true;document.getElementById('start').textContent='🔄 Play Again';return}x=15;dir=1;zone=50+Math.random()*520;paint()}document.getElementById('start').onclick=start;swing.onclick=leap;window.addEventListener('keydown',e=>{if(e.code==='Space'&&live){e.preventDefault();leap()}});paint();
</script></main></body></html>
