<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Clean-Up</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>♻️ River Clean-Up</h1><p>Tap the litter to clean the river. Leave the fish swimming safely!</p><div class="statline"><div class="stat">Litter collected <b id="score">0</b>/9</div><div class="stat">Fish bumped <b id="oops">0</b>/3</div></div><div class="message" id="msg">Press Start to help the river.</div><div class="board" id="water" style="display:grid;grid-template-columns:repeat(4,minmax(48px,90px));justify-content:center;gap:8px"></div><button class="button" id="start">▶ Start Clean-Up</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const water=document.getElementById('water'),items=['🥤','🧴','🍂','🐟','🧃','🐠','🛍️','🥫','🪵','🐟','🧻','🧃','🐡','🥤','🛍️','🍃'];let score=0,oops=0,live=false;function setup(){score=0;oops=0;live=true;document.getElementById('score').textContent=score;document.getElementById('oops').textContent=oops;document.getElementById('msg').textContent='Find and collect 9 pieces of litter.';water.innerHTML='';items.sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='choice';b.style.fontSize='1.6rem';b.style.minHeight='62px';b.textContent=x;b.onclick=()=>{if(!live)return;if(['🐟','🐠','🐡'].includes(x)){oops++;b.textContent='💦';document.getElementById('oops').textContent=oops;if(oops>=3)end('The fish need a gentler helper. Try again!');return}if(['🥤','🧴','🧃','🛍️','🥫','🧻'].includes(x)){score++;b.textContent='✨';b.disabled=true;document.getElementById('score').textContent=score;if(score>=9)end('🌟 River sparkling clean! Great work!')}else{b.textContent='🍃';b.disabled=true}};water.appendChild(b)})}function end(text){live=false;document.getElementById('msg').textContent=text}document.getElementById('start').onclick=setup;
</script></main></body></html>
