<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Rescue Path | Jungle Animal Stories</title><link rel="stylesheet" href="jungle-game-style.css"></head>
<body><main class="page"><div class="topline"><span>🌊 River Crossing</span><span class="stat">🐾 Rescue <b id="round">0</b>/5</span></div><h1>River Rescue Path</h1><p>Watch the stones glow, then repeat the safe path to help the animals cross.</p><div class="statline"><div class="stat">🐘 Animal <span id="animal">Elephant</span></div><div class="stat">📏 Path length <span id="length">3</span></div></div><div class="message" id="message">Press Start to see the first path.</div><section class="board" id="stones" aria-label="Stepping stones"></section><div class="toolbar"><button class="button" id="start">▶ Start Rescue</button></div><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main>
<script>
const icons=['🐘','🦒','🐒','🦓','🐢'],names=['Elephant','Giraffe','Monkey','Zebra','Tortoise'];let path=[],input=[],round=0,active=false;const area=document.getElementById('stones'),msg=document.getElementById('message');
function setup(){area.innerHTML='';for(let i=0;i<9;i++){const b=document.createElement('button');b.className='choice';b.textContent=['🪨','🌿','💧'][i%3];b.setAttribute('aria-label','Stone '+(i+1));b.onclick=()=>choose(i,b);area.appendChild(b)}area.style.display='grid';area.style.gridTemplateColumns='repeat(3,minmax(70px,120px))';area.style.justifyContent='center';area.style.gap='10px'}
function flash(i){const b=area.children[i];b.classList.add('selected');setTimeout(()=>b.classList.remove('selected'),420)}function showPath(){active=false;msg.textContent='Watch the safe stones...';let i=0;const timer=setInterval(()=>{flash(path[i]);i++;if(i>=path.length){clearInterval(timer);setTimeout(()=>{input=[];active=true;msg.textContent='Your turn! Tap the stones in order.'},450)}},650)}
function begin(){round=0;next()}function next(){if(round===5){msg.textContent='🎉 All five animals made it across safely!';document.getElementById('start').textContent='🔄 Play Again';active=false;return}path=Array.from({length:3+round},()=>Math.floor(Math.random()*9));input=[];document.getElementById('round').textContent=round;document.getElementById('length').textContent=path.length;document.getElementById('animal').textContent=names[round];showPath()}
function choose(i,b){if(!active)return;flash(i);input.push(i);const n=input.length-1;if(input[n]!==path[n]){active=false;msg.textContent='That stone was slippery! Watch the path once more.';setTimeout(showPath,800);return}if(input.length===path.length){active=false;round++;document.getElementById('round').textContent=round;msg.textContent=icons[round-1]+' made it across!';setTimeout(next,900)}}
document.getElementById('start').onclick=begin;setup();
</script></body></html>
