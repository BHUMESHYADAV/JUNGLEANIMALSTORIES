<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Animal Quiz</title>
<style>
body{margin:0;font-family:"Comic Sans MS",cursive;background:linear-gradient(135deg,#1b5e20,#81c784);min-height:100vh;padding:20px;box-sizing:border-box;color:#222;text-align:center}
.box{max-width:850px;margin:30px auto;background:rgba(255,255,255,.96);border-radius:28px;padding:30px;box-shadow:0 10px 30px #0005}
h1{color:#1b5e20;font-size:2.5em}button,.back{border:0;border-radius:12px;padding:12px 20px;margin:7px;background:#4caf50;color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.back:hover{background:#2e7d32}.question{font-size:1.3em;margin:20px}.choice{display:block;width:min(500px,90%);margin:10px auto;background:#e8f5e9;color:#1b5e20;border:2px solid #81c784}
.choice:hover{background:#c8e6c9}.result{font-size:1.3em;font-weight:bold;margin:20px}.animal{font-size:5em}.clue{background:#f1f8e9;padding:14px;border-radius:15px;margin:10px}
</style></head><body><div class="box">
<h1>❓ Animal Quiz Challenge</h1><div class="animal">🦁</div>
<div id="game"></div><div class="result" id="result"></div>
<a class="back" href="special-games.html">⬅ Back to Special Games</a>
<script>
const qs=[
["Which animal is known as the largest land animal?",["Elephant","Tiger","Fox","Rabbit"],0],
["What does a panda mainly eat?",["Grass","Bamboo","Fish","Meat"],1],
["Which animal has a very long neck?",["Lion","Giraffe","Bear","Wolf"],1],
["Which animal is often called the king of the jungle?",["Tiger","Elephant","Lion","Deer"],2],
["Which animal can change its skin color?",["Chameleon","Zebra","Rhino","Hippo"],0]];
let n=0,score=0;
function show(){if(n>=qs.length){document.getElementById("game").innerHTML="<h2>🎉 Quiz Complete!</h2>";document.getElementById("result").textContent="Your score: "+score+"/"+qs.length;return}
let q=qs[n];document.getElementById("game").innerHTML="<div class='question'>Question "+(n+1)+": "+q[0]+"</div>"+q[1].map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join("")}
function answer(i){if(i===qs[n][2])score++;n++;show()}show();
</script></div></body></html>
