<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footprint Trail</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><div class="topline"><span>🐾 Trackers' Trail</span><span class="stat">Tracks <b id="n">0</b>/6</span></div><h1>Footprint Trail</h1><p>Read the tracker's clue, then choose the animal that left the prints.</p><div class="message" id="msg">Start your trail!</div><section class="board"><div id="print" style="font-size:4rem">🐾</div><h2 id="clue"></h2><div id="choices" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div></section><button class="button" id="start">▶ Start Trail</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const qs=[['👣','These enormous round tracks lead to an animal with a trunk.','Elephant',['Elephant','Tiger','Fox','Parrot']],['🐾','These paw prints belong to a big cat with a mane.','Lion',['Lion','Zebra','Rabbit','Hippo']],['🦶','Long toes and branch marks show this animal climbed trees.','Monkey',['Monkey','Crocodile','Deer','Panda']],['🐾','Two-toed hoofprints match an animal with stripes.','Zebra',['Zebra','Bear','Snake','Owl']],['💧','Webbed tracks beside the river belong to this swimmer.','Duck',['Duck','Tiger','Giraffe','Fox']],['🦎','Tiny claw marks and a curling tail trail belong to this reptile.','Lizard',['Lizard','Elephant','Koala','Wolf']]];let i=0,score=0,order=[];function show(){if(i>=order.length){document.getElementById('clue').textContent='Trail complete!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='You identified '+score+' of 6 trail makers!';return}let q=qs[order[i]];document.getElementById('n').textContent=i;document.getElementById('print').textContent=q[0];document.getElementById('clue').textContent=q[1];let box=document.getElementById('choices');box.innerHTML='';q[3].forEach(name=>{let b=document.createElement('button');b.className='choice';b.textContent=name;b.onclick=()=>{if(name===q[2])score++;i++;document.getElementById('msg').textContent=name===q[2]?'Correct track! 🌟':'Keep following the trail!';setTimeout(show,650)};box.appendChild(b)})}document.getElementById('start').onclick=()=>{i=0;score=0;order=[0,1,2,3,4,5].sort(()=>Math.random()-.5);show()};
</script></body></html>
