<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safari Bingo</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🎟️ Safari Bingo</h1><p>Mark the called animal. Complete any row, column, or diagonal to win!</p><div class="message" id="msg">Press Start to draw the first animal.</div><div class="statline"><div class="stat">Called animal: <b id="call">—</b></div><div class="stat">Marks: <b id="marks">0</b></div></div><div class="board" id="grid" style="display:grid;grid-template-columns:repeat(3,minmax(70px,110px));justify-content:center;gap:8px"></div><button class="button" id="start">▶ New Bingo Board</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const animals=['🐘','🦁','🐯','🦒','🐒','🦓','🐼','🦜','🐊','🦛','🐢','🦉'];let board=[],marks=[],called=null,won=false;const grid=document.getElementById('grid');function setup(){board=[...animals].sort(()=>Math.random()-.5).slice(0,9);marks=Array(9).fill(false);won=false;grid.innerHTML='';board.forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.style.fontSize='2rem';b.style.minHeight='72px';b.textContent=a;b.onclick=()=>mark(i,b);grid.appendChild(b)});document.getElementById('marks').textContent=0;drawCall()}function drawCall(){called=board.filter((_,i)=>!marks[i])[Math.floor(Math.random()*board.filter((_,i)=>!marks[i]).length)];document.getElementById('call').textContent=called||'—'}function mark(i,b){if(won||marks[i])return;if(board[i]!==called){document.getElementById('msg').textContent='That is not the called animal. Look again!';return}marks[i]=true;b.classList.add('selected');document.getElementById('marks').textContent=marks.filter(Boolean).length;if(check()){won=true;document.getElementById('msg').textContent='🎉 Bingo! Safari champion!';document.getElementById('call').textContent='🏆';return}document.getElementById('msg').textContent='Good mark! Next animal...';drawCall()}function check(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return lines.some(l=>l.every(i=>marks[i]))}document.getElementById('start').onclick=setup;setup();
</script></main></body></html>
