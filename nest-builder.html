<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nest Builder</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🪺 Nest Builder</h1><p>Follow the bird's plan and gather the right nesting material in order.</p><div class="statline"><div class="stat">Supplies <b id="n">0</b>/6</div></div><div class="message" id="msg">Start building a cozy nest!</div><section class="board"><div id="nest" style="font-size:5rem">🪹</div><h2 id="need">The bird needs...</h2><div id="choices" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div></section><button class="button" id="start">▶ Build Nest</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const materials=[['🪵','Twigs'],['🍃','Soft leaves'],['🪶','Feathers'],['🌾','Dry grass']];let plan=[],i=0;function show(){if(i===plan.length){document.getElementById('nest').textContent='🪺';document.getElementById('need').textContent='A snug nest for the chicks!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='🎉 The bird family has a safe new home!';return}let m=materials[plan[i]];document.getElementById('n').textContent=i;document.getElementById('need').textContent='Choose: '+m[1];let box=document.getElementById('choices');box.innerHTML='';materials.forEach((x,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0]+' '+x[1];b.onclick=()=>{if(j===plan[i]){i++;document.getElementById('msg').textContent='Perfect building material!';show()}else document.getElementById('msg').textContent='The bird needs a different material for this layer.'};box.appendChild(b)})}document.getElementById('start').onclick=()=>{plan=Array.from({length:6},()=>Math.floor(Math.random()*materials.length));i=0;document.getElementById('nest').textContent='🪹';show()};
</script></main></body></html>
