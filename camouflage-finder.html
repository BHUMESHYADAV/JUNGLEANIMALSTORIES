<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camouflage Finder</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🦎 Camouflage Finder</h1><p>Study the hidden animal, then find it in the leafy picture.</p><div class="statline"><div class="stat">Found <b id="round">0</b>/5</div></div><div class="message" id="msg">Press Start to meet the hidden animal.</div><div class="board"><div id="target" style="font-size:3rem">🌿</div><div id="grid" style="display:grid;grid-template-columns:repeat(4,minmax(48px,88px));justify-content:center;gap:7px"></div></div><button class="button" id="start">▶ Start Search</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const animals=['🐸','🦎','🦋','🐍','🦜','🐢','🐒','🐞'];let found=0,target=null,live=false;const grid=document.getElementById('grid');function roundStart(){if(found===5){live=false;document.getElementById('msg').textContent='🏆 You found all five jungle neighbors!';return}target=animals[Math.floor(Math.random()*animals.length)];document.getElementById('target').textContent='Remember: '+target;grid.innerHTML='';let cells=Array.from({length:16},()=>animals[Math.floor(Math.random()*animals.length)]);const pos=Math.floor(Math.random()*16);cells[pos]=target;cells.forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.style.fontSize='1.7rem';b.style.minHeight='54px';b.textContent='🌿';b.onclick=()=>{if(!live)return;b.textContent=a;if(a===target){found++;document.getElementById('round').textContent=found;document.getElementById('msg').textContent='There it is! Well spotted!';live=false;setTimeout(roundStart,650)}else{document.getElementById('msg').textContent='Not that leaf. Keep looking!'}};grid.appendChild(b)});setTimeout(()=>{document.getElementById('target').textContent='Find it!';live=true},1200)}document.getElementById('start').onclick=()=>{found=0;document.getElementById('round').textContent=0;live=true;roundStart()};
</script></main></body></html>
