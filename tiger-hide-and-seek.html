<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🐯 Tiger Hide & Seek</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Comic Sans MS",cursive;background:linear-gradient(135deg,#173b1f,#4d7c32,#a5c66b);min-height:100vh;color:#fff;text-align:center;padding:15px}.wrap{max-width:1050px;margin:15px auto;background:rgba(0,0,0,.35);padding:24px;border-radius:28px;box-shadow:0 12px 35px rgba(0,0,0,.35)}h1{font-size:clamp(2rem,5vw,3.5rem);margin:5px 0;text-shadow:3px 3px 7px #000}.intro{font-size:1.1rem;line-height:1.5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#fff;color:#173b1f;border-radius:15px;padding:10px;font-weight:bold}.stat b{display:block;font-size:1.45rem;color:#2e7d32}.progress{height:14px;background:#ddd;border-radius:20px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:100%;background:#ffca28;transition:.3s}.hint{min-height:30px;font-weight:bold;font-size:1.05rem;margin:12px}.game-area{position:relative;height:540px;border:5px solid #7cb342;border-radius:24px;overflow:hidden;background:linear-gradient(#80cbc4 0 22%,#388e3c 22% 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.25)}.game-area:before{content:"🌳 🌿 🌴 🌳 🌿 🌴 🌳 🌿";position:absolute;top:12px;left:0;width:100%;font-size:43px;letter-spacing:10px}.ground{position:absolute;inset:120px 0 0;background:radial-gradient(circle at 20% 20%,#66bb6a 0 6%,transparent 7%),radial-gradient(circle at 80% 60%,#81c784 0 7%,transparent 8%),#2e7d32}.spot{position:absolute;border:0;background:transparent;cursor:pointer;font-size:34px;transition:.15s;z-index:3;padding:12px;border-radius:50%}.spot:hover{transform:scale(1.25);background:rgba(255,255,255,.12)}.spot.found{font-size:64px;animation:pop .5s ease}.spot.wrong{animation:shake .25s}.message{min-height:36px;font-size:1.2rem;font-weight:bold;margin:14px 0}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:13px;padding:12px 20px;background:#ff9800;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;box-shadow:2px 3px #e65100}.btn:hover{background:#f57c00}.btn.green{background:#4caf50;box-shadow:2px 3px #2e7d32}@keyframes pop{50%{transform:scale(1.5)}to{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:650px){.wrap{padding:14px}.hud{grid-template-columns:repeat(2,1fr)}.game-area{height:500px}.spot{font-size:28px}.spot.found{font-size:55px}.game-area:before{font-size:30px;letter-spacing:3px}.intro{font-size:1rem}}
</style></head><body><div class="wrap"><h1>🐯 Tiger Hide & Seek</h1><p class="intro">The tiger is hiding somewhere in the jungle! Tap the hiding spots, follow the clue, and find the tiger before time runs out.</p><div class="hud"><div class="stat">⭐ Score<b id="score">100</b></div><div class="stat">⏱️ Time<b id="time">30</b></div><div class="stat">🔎 Attempts<b id="attempts">0</b></div><div class="stat">🏆 Best<b id="best">0</b></div></div><div class="progress"><i id="bar"></i></div><div class="hint" id="hint">🌿 Press Start Game to begin!</div><div class="game-area" id="area"><div class="ground"></div></div><div class="message" id="message"></div><div class="controls"><button class="btn green" onclick="startGame()">🐯 Start / New Game</button><button class="btn" onclick="showHint()">💡 Hint</button><button class="btn" onclick="goGames()">🎮 Games Zone</button></div></div><script>
const area=document.getElementById('area'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),attemptsEl=document.getElementById('attempts'),bestEl=document.getElementById('best'),hintEl=document.getElementById('hint'),messageEl=document.getElementById('message'),bar=document.getElementById('bar');let score=100,time=30,attempts=0,tigerIndex=0,timer=null,running=false,hints=0;let best=Number(localStorage.getItem('tigerHideSeekBest')||0);bestEl.textContent=best;const spots=[['🍃',12,35],['🌳',28,60],['🪨',45,34],['🌿',62,70],['🌴',78,42],['🪵',88,72],['🌱',20,78],['🌾',52,82],['🌳',70,22],['🍂',38,20],['🌿',92,28],['🪨',8,70]];const clues=['The tiger is hiding close to something green.','The tiger is not in the open!','Look near the jungle trees.','The tiger loves a shady hiding place.','Search away from the center.'];
function build(){area.querySelectorAll('.spot').forEach(x=>x.remove());spots.forEach((s,i)=>{const b=document.createElement('button');b.className='spot';b.textContent=s[0];b.style.left=s[1]+'%';b.style.top=s[2]+'%';b.onclick=()=>choose(i,b);area.appendChild(b)})}function startGame(){clearInterval(timer);score=100;time=30;attempts=0;hints=0;running=true;tigerIndex=Math.floor(Math.random()*spots.length);messageEl.textContent='';hintEl.textContent=clues[Math.floor(Math.random()*clues.length)];update();build();timer=setInterval(()=>{time--;update();if(time<=0)endGame()},1000)}function choose(i,b){if(!running)return;attempts++;if(i===tigerIndex){b.classList.add('found');b.textContent='🐯';score+=Math.max(10,time*2);running=false;clearInterval(timer);messageEl.textContent='🎉 You found the tiger! Great jungle detective work!';hintEl.textContent='🏆 Fantastic! Start a new game to play again.';if(score>best){best=score;localStorage.setItem('tigerHideSeekBest',best);bestEl.textContent=best}try{const z=JSON.parse(localStorage.getItem('jungleZoneFeatures')||'null');if(z){z.points=(z.points||0)+score;z.played=(z.played||0)+1;z.animals=(z.animals||0)+1;localStorage.setItem('jungleZoneFeatures',JSON.stringify(z))}}catch(e){}update()}else{score=Math.max(0,score-10);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),300);hintEl.textContent='❌ Not there! Keep searching…';update()}}function showHint(){if(!running){hintEl.textContent='Press Start Game first!';return}if(hints>=3){hintEl.textContent='💡 You have used all 3 hints this round.';return}hints++;time=Math.max(1,time-2);const s=spots[tigerIndex];hintEl.textContent='💡 Hint '+hints+': Try looking '+(s[1]<50?'on the left':'on the right')+' side of the jungle.';update()}function update(){scoreEl.textContent=score;timeEl.textContent=time;attemptsEl.textContent=attempts;bar.style.width=Math.max(0,time/30*100)+'%'}function endGame(){if(!running)return;running=false;clearInterval(timer);messageEl.textContent='⏰ Time is up! The tiger escaped into the jungle. Try again!';hintEl.textContent='🐯 Here was the hiding place!';const b=document.querySelectorAll('.spot')[tigerIndex];if(b){b.classList.add('found');b.textContent='🐯'}update()}function goGames(){location.href='special-games.html'}build();update();
</script></body></html>
