<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jungle Safari Sprint | Jungle Animal Stories</title><link rel="stylesheet" href="jungle-game-style.css"></head>
<body><main class="page"><div class="topline"><span>🔎 Safari Scout</span><span class="stat">⏱ <b id="time">45</b>s</span><span class="stat">⭐ <b id="score">0</b></span></div><h1>Jungle Safari Sprint</h1><p>Read the clue and tap the matching animal. How many can you spot in 45 seconds?</p><div class="message" id="message">Press Start Safari to begin.</div><section class="board"><h2 id="clue">Your clue will appear here.</h2><div id="choices" style="display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:10px"></div></section><button class="button" id="start">▶ Start Safari</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main>
<script>
const data=[['🐘','Elephant','I use my long trunk to pick up food.','elephant.png'],['🦒','Giraffe','I reach leaves high in the treetops.','giraffe.png'],['🐒','Monkey','I swing between branches and love fruit.','monkey.png'],['🐯','Tiger','My orange coat has dark stripes.','tigercub.png'],['🦓','Zebra','My coat has black and white stripes.','zebra.png'],['🐊','Crocodile','I glide through rivers with strong jaws.','crocodile.png'],['🦜','Parrot','I have bright feathers and a curved beak.','parrot.png'],['🦛','Hippo','I spend much of my day in the water.','hippo.png'],['🦁','Lion','I am a big cat known for my mane.','lionrabbit.png'],['🐢','Tortoise','I carry a hard shell wherever I go.','tortoise.png']];let score=0,left=45,timer=0,live=false,current=null;const choices=document.getElementById('choices'),message=document.getElementById('message');
function question(){current=data[Math.floor(Math.random()*data.length)];document.getElementById('clue').textContent='🧩 '+current[2];let opts=[current];while(opts.length<4){const x=data[Math.floor(Math.random()*data.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);choices.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<img src="'+x[3]+'" alt="" style="width:48px;height:42px;object-fit:contain;vertical-align:middle"> '+x[0]+' '+x[1];b.onclick=()=>answer(x===current);choices.appendChild(b)})}
function answer(correct){if(!live)return;if(correct){score++;message.textContent='That’s right! Great spotting! 🐾'}else message.textContent='Not that one. Keep your eyes open!';document.getElementById('score').textContent=score;question()}
function start(){clearInterval(timer);score=0;left=45;live=true;document.getElementById('score').textContent=score;document.getElementById('time').textContent=left;message.textContent='Safari is on!';question();timer=setInterval(()=>{left--;document.getElementById('time').textContent=left;if(left<=0){clearInterval(timer);live=false;choices.innerHTML='';document.getElementById('clue').textContent='Safari complete!';message.textContent='🏁 You spotted '+score+' animals! Press Start Safari to play again.'}},1000)}document.getElementById('start').onclick=start;
</script></main></body></html>
