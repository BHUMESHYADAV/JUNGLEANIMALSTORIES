<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canopy Fruit Catch | Jungle Animal Stories</title><link rel="stylesheet" href="jungle-game-style.css"></head>
<body><main class="page"><div class="topline"><span>🌳 Canopy Games</span><span class="stat">🍌 Fruit <b id="score">0</b>/10</span></div><h1>Canopy Fruit Catch</h1><p>Catch 10 fruits in your basket. Use the arrow keys, A/D, or the buttons.</p><div class="toolbar"><button class="button" id="left" aria-label="Move basket left">⬅ Move</button><button class="button" id="start">▶ Start</button><button class="button" id="right" aria-label="Move basket right">Move ➡</button></div><div class="message" id="message">Ready when you are!</div><canvas id="field" width="680" height="360" aria-label="Catch falling fruit with the basket"></canvas><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),message=document.getElementById('message');let basket=300,fruit={x:100,y:0},score=0,running=false,frame=0,raf=0;const keys={};
function draw(){ctx.clearRect(0,0,680,360);ctx.fillStyle='#9bc878';ctx.fillRect(0,290,680,70);ctx.font='32px serif';ctx.fillText('🌴',18,285);ctx.fillText('🌳',580,285);ctx.font='30px serif';ctx.fillText(['🍌','🥭','🍎','🍊'][frame%4],fruit.x-14,fruit.y);ctx.fillStyle='#8b552e';ctx.fillRect(basket,312,82,10);ctx.fillStyle='#d58b3e';ctx.fillRect(basket+8,294,66,24);ctx.fillStyle='#397a42';ctx.fillRect(basket+2,290,8,30);ctx.fillRect(basket+72,290,8,30)}
function tick(){if(!running)return;frame++;if(keys.ArrowLeft||keys.a)basket-=6;if(keys.ArrowRight||keys.d)basket+=6;basket=Math.max(0,Math.min(600,basket));fruit.y+=3+Math.min(score*.15,2);if(fruit.y>282){if(fruit.x>basket-10&&fruit.x<basket+90){score++;scoreEl.textContent=score;message.textContent='Nice catch! Keep going! 🍊'}else message.textContent='Missed it! The next fruit is on its way.';fruit={x:30+Math.random()*620,y:-15};if(score>=10){running=false;message.textContent='🏆 Canopy champion! You caught 10 fruits.';document.getElementById('start').textContent='🔄 Play Again';draw();return}}draw();raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);basket=300;fruit={x:100+Math.random()*480,y:0};score=0;frame=0;scoreEl.textContent='0';message.textContent='Catch the fruit!';running=true;tick()}function move(dir){basket=Math.max(0,Math.min(600,basket+dir*38));draw()}
document.getElementById('start').onclick=start;document.getElementById('left').onpointerdown=()=>move(-1);document.getElementById('right').onpointerdown=()=>move(1);window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);draw();
</script></body></html>
