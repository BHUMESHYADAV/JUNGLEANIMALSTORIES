<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jungle Food Match | Jungle Animal Stories</title><link rel="stylesheet" href="jungle-game-style.css"></head>
<body><main class="page"><div class="topline"><span>🍃 Jungle Pantry</span><span class="stat">🥭 <b id="score">0</b>/8</span></div><h1>Jungle Food Match</h1><p>Pick a food that belongs in each animal’s meal. Complete all eight rounds!</p><div class="message" id="message">Ready to fill the pantry?</div><section class="board"><img id="animal" src="giraffe.png" alt="Giraffe" style="width:130px;height:120px;object-fit:contain"><h2 id="prompt">What is this animal's favorite food?</h2><div id="choices" style="display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:10px"></div></section><button class="button" id="start">▶ Start Matching</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main>
<script>
const rounds=[['🐼','Panda','🎋 Bamboo',['Bamboo','Fish','Grass','Nuts'],'panda.png'],['🐒','Monkey','🍌 Bananas',['Bananas','Bamboo','Leaves','Seaweed'],'monkey.png'],['🦒','Giraffe','🍃 Tree leaves',['Tree leaves','Fish','Seeds','Meat'],'giraffe.png'],['🐘','Elephant','🌿 Grass and leaves',['Grass and leaves','Bamboo only','Fish','Honey'],'elephant.png'],['🐯','Tiger','🍖 Meat',['Meat','Fruit','Grass','Nectar'],'tigercub.png'],['🦜','Parrot','🌰 Seeds and fruit',['Seeds and fruit','Fish','Bamboo','Grass'],'parrot.png'],['🐊','Crocodile','🐟 Fish',['Fish','Nectar','Bamboo','Leaves'],'crocodile.png'],['🐢','Tortoise','🥬 Greens',['Greens','Meat','Nuts','Fish'],'tortoise.png']];let order=[],index=0,score=0,locked=false;const msg=document.getElementById('message');
function show(){if(index>=order.length){document.getElementById('animal').src='';document.getElementById('animal').alt='Complete';document.getElementById('animal').style.display='none';document.getElementById('prompt').textContent='Pantry complete!';document.getElementById('choices').innerHTML='';msg.textContent='You matched '+score+' out of 8 foods. Start again for another round!';return}const a=rounds[order[index]],picture=document.getElementById('animal');picture.style.display='inline-block';picture.src=a[4];picture.alt=a[1];document.getElementById('prompt').textContent='What does the '+a[1]+' eat?';document.getElementById('score').textContent=score;const opts=[...a[3]].sort(()=>Math.random()-.5),box=document.getElementById('choices');box.innerHTML='';opts.forEach(food=>{let b=document.createElement('button');b.className='choice';b.textContent=food;b.onclick=()=>pick(food===a[2]);box.appendChild(b)})}
function pick(ok){if(locked)return;locked=true;if(ok){score++;msg.textContent='Correct! Added to the pantry. 🌟'}else msg.textContent='Good try! Remember '+rounds[order[index]][1]+' likes '+rounds[order[index]][2]+'.';index++;document.getElementById('score').textContent=score;setTimeout(()=>{locked=false;show()},1000)}function start(){order=rounds.map((_,i)=>i).sort(()=>Math.random()-.5);index=0;score=0;locked=false;msg.textContent='Choose the right food!';show()}document.getElementById('start').onclick=start;
</script></main></body></html>
