<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monkey Balance</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🐒 Monkey Balance</h1><p>Help the monkeys balance both baskets by choosing the missing fruit count.</p><div class="statline"><div class="stat">Balanced <b id="score">0</b>/8</div></div><div class="message" id="msg">Ready to balance the baskets?</div><section class="board"><div style="font-size:2.4rem">🧺 <span id="left"></span>　⚖️　🧺 <span id="right"></span></div><h2 id="question"></h2><div id="choices" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"></div></section><button class="button" id="start">▶ Start Balancing</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
let i=0,score=0,answer=0;function show(){if(i>=8){document.getElementById('question').textContent='The baskets are balanced!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='🏆 You balanced '+score+' baskets!';return}let a=1+Math.floor(Math.random()*8),b=1+Math.floor(Math.random()*8);answer=a+b;document.getElementById('left').textContent='🍌'.repeat(a);document.getElementById('right').textContent='🍎'.repeat(b);document.getElementById('question').textContent='How many fruits altogether? '+a+' + '+b+' = ?';let options=new Set([answer,Math.max(1,answer-2),answer+1,Math.max(1,answer-1)]),box=document.getElementById('choices');box.innerHTML='';[...options].sort(()=>Math.random()-.5).forEach(n=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=n;btn.onclick=()=>{if(n===answer)score++;i++;document.getElementById('score').textContent=score;document.getElementById('msg').textContent=n===answer?'Balanced perfectly!':'Try the next basket!';setTimeout(show,650)};box.appendChild(btn)})}document.getElementById('start').onclick=()=>{i=0;score=0;document.getElementById('score').textContent=0;show()};
</script></main></body></html>
