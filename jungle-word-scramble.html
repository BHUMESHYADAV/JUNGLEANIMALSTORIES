<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jungle Word Scramble</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🔤 Jungle Word Scramble</h1><p>Unscramble the animal name. Type your answer and press Enter.</p><div class="statline"><div class="stat">Solved <b id="score">0</b>/8</div><div class="stat">⏱ <b id="time">90</b>s</div></div><div class="message" id="msg">Start the word challenge!</div><section class="board"><div id="hint" style="font-size:2.7rem">🐾</div><h2 id="letters">—</h2><input id="answer" aria-label="Animal name" autocomplete="off" style="font:inherit;padding:10px;border:2px solid #9cbe77;border-radius:8px;width:min(100%,300px)"><button class="button" id="check">Check</button></section><button class="button" id="start">▶ Start Scramble</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const words=[['TIGER','🐯'],['ZEBRA','🦓'],['PANDA','🐼'],['SNAKE','🐍'],['KOALA','🐨'],['HIPPO','🦛'],['MOUSE','🐭'],['LION','🦁']];let i=0,left=90,timer=0,current=null,live=false;function show(){if(i>=8){live=false;clearInterval(timer);document.getElementById('letters').textContent='Challenge complete!';document.getElementById('msg').textContent='🎉 You solved '+i+' animal names!';return}current=words[i];let s=current[0].split('');for(let j=s.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[s[j],s[k]]=[s[k],s[j]]}if(s.join('')===current[0])s.reverse();document.getElementById('hint').textContent=current[1];document.getElementById('letters').textContent=s.join('  ');document.getElementById('answer').value='';document.getElementById('answer').focus()}function check(){if(!live)return;if(document.getElementById('answer').value.trim().toUpperCase()===current[0]){i++;document.getElementById('score').textContent=i;document.getElementById('msg').textContent='Correct! Next animal...';show()}else document.getElementById('msg').textContent='Try rearranging those letters.'}document.getElementById('check').onclick=check;document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')check()};document.getElementById('start').onclick=()=>{clearInterval(timer);i=0;left=90;live=true;document.getElementById('score').textContent=0;document.getElementById('time').textContent=left;document.getElementById('msg').textContent='Go!';show();timer=setInterval(()=>{left--;document.getElementById('time').textContent=left;if(left<=0){live=false;clearInterval(timer);document.getElementById('msg').textContent='⏰ Time! You solved '+i+' words. Press Start to play again.'}},1000)};
</script></main></body></html>
