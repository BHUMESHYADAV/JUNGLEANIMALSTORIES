<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parrot Pattern</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🦜 Parrot Pattern</h1><p>Watch the feather colors light up, then tap them in the same order.</p><div class="statline"><div class="stat">Round <b id="round">0</b>/5</div></div><div class="message" id="msg">Ready to test your memory?</div><div class="board" id="pads" style="display:grid;grid-template-columns:repeat(2,minmax(100px,150px));justify-content:center;gap:12px"></div><button class="button" id="start">▶ Start Pattern</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const colors=['🔴','🔵','🟡','🟢'],pads=document.getElementById('pads');let seq=[],turn=0,round=0,active=false;colors.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.style.fontSize='2rem';b.style.minHeight='86px';b.textContent=c;b.onclick=()=>tap(i);pads.appendChild(b)});function flash(i){let b=pads.children[i];b.classList.add('selected');setTimeout(()=>b.classList.remove('selected'),380)}function play(){active=false;turn=0;document.getElementById('msg').textContent='Watch the pattern...';let j=0,t=setInterval(()=>{flash(seq[j++]);if(j===seq.length){clearInterval(t);setTimeout(()=>{active=true;document.getElementById('msg').textContent='Your turn! Repeat the pattern.'},450)}},650)}function tap(i){if(!active)return;flash(i);if(seq[turn]!==i){active=false;document.getElementById('msg').textContent='Almost! Try the pattern again.';setTimeout(play,850);return}turn++;if(turn===seq.length){active=false;round++;document.getElementById('round').textContent=round;if(round===5){document.getElementById('msg').textContent='🎉 Amazing memory! The parrot is impressed.';return}seq.push(Math.floor(Math.random()*4));setTimeout(play,650)}}document.getElementById('start').onclick=()=>{round=0;seq=[Math.floor(Math.random()*4)];document.getElementById('round').textContent=0;play()};
</script></body></html>
