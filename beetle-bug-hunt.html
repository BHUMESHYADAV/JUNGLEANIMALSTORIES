<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beetle Bug Hunt</title><link rel="stylesheet" href="jungle-game-style.css"></head><body><main class="page"><h1>🪲 Beetle Bug Hunt</h1><p>Tap the beetles as they peek out. Quick eyes, gentle hands!</p><div class="statline"><div class="stat">Caught <b id="score">0</b></div><div class="stat">⏱ <b id="time">20</b>s</div></div><div class="message" id="msg">Press Start when you're ready.</div><div class="board" id="holes" style="display:grid;grid-template-columns:repeat(3,minmax(70px,120px));justify-content:center;gap:10px"></div><button class="button" id="start">▶ Start Hunt</button><div class="nav"><a href="special-games.html">🎮 All Games</a><a href="index.html">🏠 Jungle Home</a></div></main><script>
const holes=document.getElementById('holes');let score=0,left=20,live=false,tickTimer=0,bugTimer=0;function setup(){clearInterval(tickTimer);clearInterval(bugTimer);score=0;left=20;live=true;document.getElementById('score').textContent=score;document.getElementById('time').textContent=left;document.getElementById('msg').textContent='Tap a beetle when it appears!';holes.innerHTML='';for(let i=0;i<9;i++){let b=document.createElement('button');b.className='choice';b.textContent='🕳️';b.style.fontSize='1.8rem';b.style.minHeight='72px';b.onclick=()=>{if(live&&b.textContent==='🪲'){score++;document.getElementById('score').textContent=score;b.textContent='🌱'}};holes.appendChild(b)}function pop(){if(!live)return;[...holes.children].forEach(b=>{if(b.textContent==='🪲')b.textContent='🕳️'});let b=holes.children[Math.floor(Math.random()*9)];b.textContent='🪲';setTimeout(()=>{if(b.textContent==='🪲')b.textContent='🕳️'},750)}pop();bugTimer=setInterval(pop,850);tickTimer=setInterval(()=>{left--;document.getElementById('time').textContent=left;if(left<=0){live=false;clearInterval(bugTimer);clearInterval(tickTimer);document.getElementById('msg').textContent='🏁 Hunt over! You caught '+score+' beetles.'}},1000)}document.getElementById('start').onclick=setup;
</script></main></body></html>
